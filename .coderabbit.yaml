# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit-specific adapter. Canonical repository guidance stays in
# AGENTS.md, routed skills, schemas, tests, and tools.
---
inheritance: false
early_access: true
tone_instructions: >-
  Be warm, precise, concrete, and evidence-led. Treat agents as capable
  collaborators: give context and desired outcomes, preserve autonomy, and
  flag concrete risks or boundary violations—not preferred process.
reviews:
  profile: assertive
  request_changes_workflow: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  related_issues: true
  related_prs: true
  poem: true
  suggested_labels: true
  auto_apply_labels: true
  auto_review:
    drafts: true
  finishing_touches:
    docstrings:
      enabled: false
    simplify:
      enabled: true
chat:
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled
knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/AGENTS.md"
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    auto_apply_labels: true
